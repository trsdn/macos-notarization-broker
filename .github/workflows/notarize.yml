name: Notarize macOS release
run-name: Notarize ${{ inputs.app }} ${{ inputs.tag }} (${{ inputs.request_id }})

on:
  workflow_dispatch:
    inputs:
      app:
        description: Application profile
        required: true
        type: choice
        options:
          - md2loop
          - openconnct
          - opendefendrwatchr
          - openwritr
          - ptionsplus
          - spacemender
          - teleprompter
      tag:
        description: Existing release tag, for example v1.0.2
        required: true
        type: string
      request_id:
        description: Optional request correlation ID
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  group: notarize-${{ inputs.app }}-${{ inputs.tag }}
  cancel-in-progress: false

env:
  EXPECTED_BROKER_REPOSITORY: trsdn/macos-notarization-broker
  EXPECTED_BROKER_REPOSITORY_ID: "1315404585"
  AUTHORIZED_ACTOR_ID: "24534196"

jobs:
  resolve:
    name: Authorize and resolve immutable source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      app: ${{ steps.resolve.outputs.app }}
      tag: ${{ steps.resolve.outputs.tag }}
      repository: ${{ steps.resolve.outputs.repository }}
      repository_id: ${{ steps.resolve.outputs.repository_id }}
      ref_target_sha: ${{ steps.resolve.outputs.ref_target_sha }}
      tag_object_sha: ${{ steps.resolve.outputs.tag_object_sha }}
      commit_sha: ${{ steps.resolve.outputs.commit_sha }}
      version: ${{ steps.resolve.outputs.version }}
      request_id: ${{ steps.resolve.outputs.request_id }}
      profile_digest: ${{ steps.resolve.outputs.profile_digest }}
      artifact_name: ${{ steps.resolve.outputs.artifact_name }}
    steps:
      - name: Authorize upstream manual dispatch
        env:
          ACTOR_ID: ${{ github.actor_id }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.event.repository.id }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$EVENT_NAME" == "workflow_dispatch" ]]
          [[ "$REPOSITORY" == "$EXPECTED_BROKER_REPOSITORY" ]]
          [[ "$REPOSITORY_ID" == "$EXPECTED_BROKER_REPOSITORY_ID" ]]
          [[ "$REF" == "refs/heads/main" ]]
          [[ "$ACTOR_ID" == "$AUTHORIZED_ACTOR_ID" ]] || {
            echo "This broker accepts dispatches only from its fixed owner identity." >&2
            exit 1
          }

      - name: Check out immutable broker logic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve tag to full commit SHA
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_APP: ${{ inputs.app }}
          INPUT_REQUEST_ID: ${{ inputs.request_id }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          python3 scripts/broker.py resolve \
            --app "$INPUT_APP" \
            --tag "$INPUT_TAG" \
            --request-id "$INPUT_REQUEST_ID" \
            --output resolution.json

  build:
    name: Build untrusted source without Apple credentials
    needs: resolve
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check out immutable broker logic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: broker
          persist-credentials: false

      - name: Check out external source at resolved commit
        env:
          SOURCE_REPOSITORY: ${{ needs.resolve.outputs.repository }}
          SOURCE_SHA: ${{ needs.resolve.outputs.commit_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init source
          git -C source remote add origin "https://github.com/${SOURCE_REPOSITORY}.git"
          git -C source -c protocol.version=2 fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          git -C source checkout --detach FETCH_HEAD
          [[ "$(git -C source rev-parse HEAD)" == "$SOURCE_SHA" ]]
          git -C source remote remove origin

      - name: Build unsigned application with broker adapter
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          PROFILE: ${{ needs.resolve.outputs.app }}
          SOURCE_SHA: ${{ needs.resolve.outputs.commit_sha }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p unsigned
          python3 broker/scripts/broker.py build \
            --app "$PROFILE" \
            --source source \
            --version "$VERSION" \
            --commit-sha "$SOURCE_SHA" \
            --build-number "$BUILD_NUMBER" \
            --output unsigned/unsigned-app.zip

      - name: Upload untrusted unsigned bundle
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-${{ inputs.app }}-${{ needs.resolve.outputs.commit_sha }}
          path: unsigned/unsigned-app.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  preflight:
    name: Sanitize and validate unsigned bundle
    needs:
      - resolve
      - build
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      archive_sha256: ${{ steps.validate.outputs.validated_archive_sha256 }}
      tree_sha256: ${{ steps.validate.outputs.tree_sha256 }}
    steps:
      - name: Check out immutable broker logic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: broker
          persist-credentials: false

      - name: Download exact unsigned artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: untrusted
          merge-multiple: true

      - name: Validate identity and bundle structure
        id: validate
        env:
          PROFILE: ${{ needs.resolve.outputs.app }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p validated
          python3 broker/scripts/broker.py validate \
            --app "$PROFILE" \
            --version "$VERSION" \
            --archive untrusted/unsigned-app.zip \
            --extract-to preflight-work \
            --validated-archive validated/validated-app.zip \
            --manifest validated/preflight-manifest.json

      - name: Upload immutable validated bundle
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validated-${{ inputs.app }}-${{ needs.resolve.outputs.commit_sha }}
          path: validated/
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  sign:
    name: Sign and notarize with broker-owned logic
    needs:
      - resolve
      - preflight
    runs-on: macos-15
    timeout-minutes: 90
    environment: macos-signing
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out immutable broker logic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: broker
          persist-credentials: false

      - name: Download exact validated artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.preflight.outputs.artifact_id }}
          path: validated
          merge-multiple: true

      - name: Revalidate before certificate import
        env:
          EXPECTED_ARCHIVE_SHA: ${{ needs.preflight.outputs.archive_sha256 }}
          EXPECTED_TREE_SHA: ${{ needs.preflight.outputs.tree_sha256 }}
          PROFILE: ${{ needs.resolve.outputs.app }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          python3 broker/scripts/broker.py validate \
            --app "$PROFILE" \
            --version "$VERSION" \
            --archive validated/validated-app.zip \
            --extract-to signing-input \
            --expected-archive-sha "$EXPECTED_ARCHIVE_SHA" \
            --expected-tree-sha "$EXPECTED_TREE_SHA"

      - name: Confirm tag has not moved
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE: ${{ needs.resolve.outputs.app }}
          REQUEST_ID: ${{ needs.resolve.outputs.request_id }}
          SOURCE_SHA: ${{ needs.resolve.outputs.commit_sha }}
          SOURCE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          python3 broker/scripts/broker.py resolve \
            --app "$PROFILE" \
            --tag "$SOURCE_TAG" \
            --request-id "$REQUEST_ID" \
            --expect-sha "$SOURCE_SHA"

      - name: Sign, notarize, and package
        env:
          BROKER_COMMIT_SHA: ${{ github.sha }}
          BROKER_REPOSITORY: ${{ github.repository }}
          EXPECTED_TREE_SHA: ${{ needs.preflight.outputs.tree_sha256 }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          PROFILE: ${{ needs.resolve.outputs.app }}
          PROFILE_DIGEST: ${{ needs.resolve.outputs.profile_digest }}
          REQUEST_ID: ${{ needs.resolve.outputs.request_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_COMMIT_SHA: ${{ needs.resolve.outputs.commit_sha }}
          SOURCE_REF_SHA: ${{ needs.resolve.outputs.ref_target_sha }}
          SOURCE_REPOSITORY: ${{ needs.resolve.outputs.repository }}
          SOURCE_REPOSITORY_ID: ${{ needs.resolve.outputs.repository_id }}
          SOURCE_TAG: ${{ needs.resolve.outputs.tag }}
          SOURCE_TAG_OBJECT_SHA: ${{ needs.resolve.outputs.tag_object_sha }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          mkdir broker-output
          python3 broker/scripts/broker.py sign \
            --app "$PROFILE" \
            --version "$VERSION" \
            --app-root signing-input \
            --expected-tree-sha "$EXPECTED_TREE_SHA" \
            --profile-digest "$PROFILE_DIGEST" \
            --preflight-manifest validated/preflight-manifest.json \
            --output-dir broker-output \
            --request-id "$REQUEST_ID" \
            --source-repository "$SOURCE_REPOSITORY" \
            --source-repository-id "$SOURCE_REPOSITORY_ID" \
            --source-tag "$SOURCE_TAG" \
            --source-ref-sha "$SOURCE_REF_SHA" \
            --source-tag-object-sha "$SOURCE_TAG_OBJECT_SHA" \
            --source-commit-sha "$SOURCE_COMMIT_SHA" \
            --broker-repository "$BROKER_REPOSITORY" \
            --broker-commit-sha "$BROKER_COMMIT_SHA" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT"

      - name: Upload notarized artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.resolve.outputs.artifact_name }}
          path: broker-output/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
