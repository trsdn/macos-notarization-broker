name: Migrate signing secrets to protected environment
run-name: Migrate signing secrets (${{ github.run_id }})

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: migrate-signing-secrets
  cancel-in-progress: false

jobs:
  seal:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'trsdn/macos-notarization-broker' &&
      github.event.repository.id == 1315404585 &&
      github.actor_id == '24534196'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: macos-signing
    permissions:
      contents: read
    steps:
      - name: Check out immutable broker logic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install sealed-box encryption library
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsodium23

      - name: Encrypt only for the pinned GitHub environment
        env:
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: python3 scripts/migrate-signing-secrets.py

      - name: Upload sealed ciphertext only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sealed-signing-secrets-${{ github.run_id }}
          path: sealed-signing-secrets.json
          if-no-files-found: error
          retention-days: 1
